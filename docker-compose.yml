version: "3.9"

services:
  download-worker:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: manga-download-worker
    env_file:
      - .env
    environment:
      DOWNLOAD_FOLDER: /downloads
      VIDEO_DOWNLOAD_FOLDER: /downloads/videos
    volumes:
      - ./downloads:/downloads
    command: ["--queue", "download"]

  pdf-worker:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: manga-pdf-worker
    env_file:
      - .env
    environment:
      DOWNLOAD_FOLDER: /downloads
      VIDEO_DOWNLOAD_FOLDER: /downloads/videos
    volumes:
      - ./downloads:/downloads
    command: ["--queue", "pdf"]

  webdav-worker:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: manga-webdav-worker
    env_file:
      - .env
    environment:
      DOWNLOAD_FOLDER: /downloads
      VIDEO_DOWNLOAD_FOLDER: /downloads/videos
    volumes:
      - ./downloads:/downloads
    command: ["--queue", "webdav"]
